<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Usuário</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Cadastro de Usuário</h2>
        <form action="#" method="post">
            <label for="cad_usuario_nome">Nome Completo:</label>
            <input type="text" name="cad_usuario_nome" id="cad_usuario_nome" required>

            <label for="cad_usuario_email">E-mail:</label>
            <input type="email" name="cad_usuario_email" id="cad_usuario_email" required>

            <label for="cad_usuario_senha">Senha:</label>
            <input type="password" name="cad_usuario_senha" id="cad_usuario_senha" required>

            <button type="submit">Cadastrar</button>
        </form>
        <div class="nav-links">
            <a href="index.html">Voltar para o Login</a>
        </div>
    </div>
</body>
</html>
