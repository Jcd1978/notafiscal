<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Produto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Cadastro de Produto</h2>
        <form action="#" method="post">
            <label for="produto_nome">Nome do Produto:</label>
            <input type="text" name="produto_nome" id="produto_nome" required>

            <label for="produto_codigo">Código de Barras:</label>
            <input type="text" name="produto_codigo" id="produto_codigo" required>

            <label for="produto_preco">Preço de Venda:</label>
            <input type="number" step="0.01" name="produto_preco" id="produto_preco" required>

            <button type="submit">Salvar Produto</button>
        </form>
        <div class="nav-links">
            <a href="home.html">Voltar para Home</a>
        </div>
    </div>
</body>
</html>
