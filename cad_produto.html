<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Produto</title>
</head>
<body>
    <h2>Cadastro de Produto</h2>
    <form action="/salvar-produto" method="POST">
        <label for="nome_produto">Nome do Produto:</label><br>
        <input type="text" id="nome_produto" name="nm_produto" maxlength="25" required><br><br>

        <label for="valor_unitario">Valor Unitário (R$):</label><br>
        <input type="number" id="valor_unitario" name="vl_unitario" step="0.01" min="0" required><br><br>

        <button type="submit">Cadastrar Produto</button>
    </form>
</body>
</html>
