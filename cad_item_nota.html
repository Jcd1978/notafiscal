<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Item da Nota</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Adicionar Item à Nota</h2>
        <form action="php/insert_item_nota.php" method="post">
            <label for="cd_nota">Número da Nota:</label>
            <input type="number" name="cd_nota" id="cd_nota" required>

            <label for="cd_produto">ID do Produto:</label>
            <input type="number" name="cd_produto" id="cd_produto" required>

            <label for="qt">Quantidade:</label>
            <input type="number" name="qt" id="qt" min="1" required>

            <button type="submit">Adicionar Item</button>
        </form>
        <div class="nav-links">
            <a href="cad_nota.html">Voltar para a Nota</a>
            <a href="home.html">Voltar para Home</a>
        </div>
    </div>
</body>
</html>
