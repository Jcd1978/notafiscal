<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Item da Nota</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Adicionar Item à Nota</h2>
        <form action="#" method="post">
            <label for="item_nota_numero">Número da Nota:</label>
            <input type="number" name="item_nota_numero" id="item_nota_numero" required>

            <label for="item_produto_id">ID do Produto:</label>
            <input type="text" name="item_produto_id" id="item_produto_id" required>

            <label for="item_quantidade">Quantidade:</label>
            <input type="number" name="item_quantidade" id="item_quantidade" min="1" required>

            <button type="submit">Adicionar Item</button>
        </form>
        <div class="nav-links">
            <a href="cad_nota.html">Voltar para a Nota</a>
            <a href="home.html">Voltar para Home</a>
        </div>
    </div>
</body>
</html>
