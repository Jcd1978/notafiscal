<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Login</h1>
        <form action="#" method="post">
            <label for="login_usuario">Usuário:</label>
            <input type="text" name="login_usuario" id="login_usuario" required>

            <label for="login_senha">Senha:</label>
            <input type="password" name="login_senha" id="login_senha" required>

            <!-- Simulação: Entrar Redireciona para a Home -->
            <button type="button" onclick="window.location.href='home.html'">Entrar</button>
        </form>
        <div class="nav-links">
            <a href="cad_usuario.html">Não tem conta? Cadastre-se</a>
        </div>
    </div>
</body>
</html>
