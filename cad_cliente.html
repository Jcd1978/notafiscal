<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Cliente</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Cadastro de Cliente</h2>
        <form action="#" method="post">
            <label for="cliente_nome">Nome / Razão Social:</label>
            <input type="text" name="cliente_nome" id="cliente_nome" required>

            <label for="cliente_documento">CPF / CNPJ:</label>
            <input type="text" name="cliente_documento" id="cliente_documento" required>

            <label for="cliente_telefone">Telefone:</label>
            <input type="tel" name="cliente_telefone" id="cliente_telefone">

            <button type="submit">Salvar Cliente</button>
        </form>
        <div class="nav-links">
            <a href="home.html">Voltar para Home</a>
        </div>
    </div>
</body>
</html>
