<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Cliente</title>
</head>
<body>
    <h2>Cadastro de Cliente</h2>
    <form action="/salvar-cliente" method="POST">
        <label for="cnpj">CNPJ:</label><br>
        <input type="text" id="cnpj" name="nr_cnpj" maxlength="14" required><br><br>

        <label for="razao_social">Razão Social:</label><br>
        <input type="text" id="razao_social" name="nm_razao_social" maxlength="30" required><br><br>

        <label for="pais">País:</label><br>
        <input type="text" id="pais" name="nm_pais" maxlength="20" required><br><br>

        <label for="email">E-mail:</label><br>
        <input type="email" id="email" name="nm_email" maxlength="40" required><br><br>

        <button type="submit">Cadastrar Cliente</button>
    </form>
</body>
</html>
