<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Cliente</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Cadastro de Cliente</h2>
        <form action="php/insert_cliente.php" method="post">
            
            <label for="cnpj">CNPJ:</label>
            <input type="text" name="cnpj" id="cnpj" placeholder="00.000.000/0001-00" maxlength="18" required>

            <label for="razao">Razão Social:</label>
            <input type="text" name="razao" id="razao" required>

            <label for="pais">País:</label>
            <input type="pais" name="pais" id="pais">

            <label for="email">Email:</label>
            <input type="email" name="email" id="email" placeholder="seuemail@exemplo.com" maxlength="100" required>


            <button type="submit">Salvar Cliente</button>
        </form>
        <div class="nav-links">
            <a href="home.html">Voltar para Home</a>
        </div>
    </div>
</body>
</html>
